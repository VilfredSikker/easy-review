# Pinned because the clippy gate treats pedantic lints as errors and budgets
# exact counts (ADR 0038): a new stable release can add or change a lint and
# fail CI with no code change. Upgrade deliberately: bump this and the
# `dtolnay/rust-toolchain@<version>` steps in .github/workflows/ci.yml, then
# run `just clippy` and fix or accept what the new clippy reports.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
