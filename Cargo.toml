[workspace]
resolver = "2"
members = ["crates/er-agent", "crates/er-core", "crates/er-engine", "crates/er-service", "crates/er-tui", "crates/er-desktop", "crates/er-mcp", "crates/er-crap", "crates/er-lint-gate", "crates/er-git", "crates/er-github", "crates/er-store", "crates/er-protocol"]

[workspace.package]
version = "0.6.5"
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/VilfredSikker/easy-review"

[workspace.dependencies]
# shared deps — pin once, reuse across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
sha2 = "0.10"
sha1 = "0.10"
glob = "0.3"
toml = "1"
dirs = "6"
notify = "8"
notify-debouncer-mini = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Exact: the TypeScript it generates is committed, so an update is a
# deliberate `just protocol-gen`, never a side effect of `cargo update`.
ts-rs = "=12.0.1"

# Lint is a gate, in two tiers (docs/adr/0038-lint-is-a-ratcheted-gate.md).
# `just clippy` runs it through er-lint-gate, which fails on any diagnostic
# except the budgeted lints listed under [workspace.metadata.lint-gate]; those
# are counted per file against clippy-warning-budget.json and may only shrink.
[workspace.lints.clippy]
# ── error tier ──────────────────────────────────────────────────────────────
# Pedantic is on as a group, so a pedantic lint with no hits today guards new
# code for free. The allows below each had many hits that are an idiom here,
# or churn with no reader benefit.
pedantic = { level = "deny", priority = -1 }
uninlined_format_args = "allow"          # `{}` with a trailing arg reads fine
missing_errors_doc = "allow"             # internal crates; errors are anyhow strings
missing_panics_doc = "allow"
must_use_candidate = "allow"             # would tag most getters
doc_markdown = "allow"                   # prose names like GitHub, macOS
needless_pass_by_value = "allow"         # Tauri commands must take owned args
map_unwrap_or = "allow"
manual_string_new = "allow"
redundant_closure_for_method_calls = "allow"
too_many_lines = "allow"                 # a length cap splits one coherent idea in two
manual_let_else = "allow"
single_match_else = "allow"
match_same_arms = "allow"                # arms kept separate on purpose, per case
items_after_statements = "allow"
if_not_else = "allow"
similar_names = "allow"
explicit_iter_loop = "allow"
assigning_clones = "allow"
format_push_string = "allow"
needless_raw_string_hashes = "allow"     # prompt templates keep r#"…"# uniform
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"         # snapshot/config structs mirror flags
implicit_hasher = "allow"
case_sensitive_file_extension_comparisons = "allow"
unnecessary_wraps = "allow"              # Result/Option signatures match sibling handlers
default_trait_access = "allow"
unreadable_literal = "allow"
wildcard_imports = "allow"
bool_to_int_with_if = "allow"
# Keep `if let Some(x) = … { } else { }` over `Option::map_or[_else]`: the
# branches here are usually multi-statement, and the if-let form reads better.
# A nursery lint, so this only matters if nursery is ever enabled.
option_if_let_else = "allow"
# The desktop's App mutex guard is held across state work inside commands on
# purpose; dropping it earlier is churn with no IO win. Also nursery.
significant_drop_tightening = "allow"

dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
# Restriction lints probed and left off: indexing_slicing (it fires on nearly
# every index, far too many sites to budget or review one by one),
# let_underscore_must_use (`let _ = tx.send(..)` is the idiom for a receiver
# that may be gone), str_to_string (churn), panic (its hits are test helpers),
# print_stderr (the front ends and dev_log write to stderr on purpose), and
# cognitive_complexity, because er-crap already owns complexity (ADR 0028)
# and two measures that disagree would give two answers.

# ── warn tier: budgeted per file in clippy-warning-budget.json ──────────────
unwrap_used = "warn"
expect_used = "warn"
string_slice = "warn"                    # byte-index slicing panics off a UTF-8 boundary
excessive_nesting = "warn"               # threshold in clippy.toml
allow_attributes = "warn"                # prefer #[expect], which fails once unneeded
allow_attributes_without_reason = "warn"

[workspace.metadata.lint-gate]
# The warn tier. Every other diagnostic fails the gate outright.
budgeted = [
    "clippy::too_many_arguments",
    "clippy::type_complexity",
    "clippy::excessive_nesting",
    "clippy::unwrap_used",
    "clippy::expect_used",
    "clippy::string_slice",
    "clippy::allow_attributes",
    "clippy::allow_attributes_without_reason",
    "er::impl_cohesion",
]
# An inherent impl is flagged when its methods fall into more than max-groups
# groups that never use each other, each spanning min-group-lines or more.
impl-cohesion = { max-groups = 1, min-group-lines = 40 }

# Direct `std::fs` access in these files is an error: they read and write
# through `er_store::ArtifactStore`. The list only grows as modules migrate.
sidecar-fs-deny = [
  "crates/er-engine/src/ai/annotation_store.rs",
  "crates/er-engine/src/ai/promote.rs",
  "crates/er-engine/src/ai/checklist_store.rs",
  "crates/er-engine/src/ai/loader.rs",
  "crates/er-engine/src/ai/diagrams.rs",
  "crates/er-engine/src/ai/triage.rs",
  "crates/er-engine/src/ai/professor.rs",
  "crates/er-engine/src/ai/experts.rs",
  "crates/er-engine/src/ai/finding_cleanup.rs",
  "crates/er-engine/src/ai/finding_responses.rs",
  "crates/er-engine/src/ai/scoped_overlay.rs",
  "crates/er-engine/src/ai/validation.rs",
  "crates/er-engine/src/ai/workflow_record.rs",
  "crates/er-engine/src/ai/panel_run.rs",
  "crates/er-engine/src/sidecar_upload.rs",
  "crates/er-engine/src/diagram_upload.rs",
  "crates/er-engine/src/app/state/session_store.rs",
  "crates/er-engine/src/app/state/comments.rs",
  "crates/er-engine/src/app/state/review_flow.rs",
  "crates/er-engine/src/app/state/review_flow_output.rs",
  "crates/er-engine/src/app/state/review_flow/results.rs",
  "crates/er-engine/src/arena/import.rs",
  "crates/er-engine/src/arena/seeded.rs",
  "crates/er-engine/src/projects_pins.rs",
  "crates/er-engine/src/release_update.rs",
  "crates/er-desktop/src/projects.rs",
  "crates/er-desktop/src/inbox.rs",
  "crates/er-desktop/src/pr_cache.rs",
  "crates/er-desktop/src/pr_open_cache.rs",
  "crates/er-desktop/src/gh_status_cache.rs",
  "crates/er-desktop/src/tabs.rs",
]

# A hand-built GitHub comment intent is an error outside these files; every
# other module goes through `ai::promote`. The list is shrink-only: an entry
# with no findings fails as stale.
comment-boundary = { allow = [
  "crates/er-engine/src/github_post_session.rs",
  "crates/er-engine/src/github_post.rs",
  "crates/er-desktop/src/github_comment_builders.rs",
  "crates/er-github/src/review.rs",
] }

