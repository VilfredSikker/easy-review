# A program spawn outside the agent runtime: every `Command::new` in a crate's
# `src/` is an error unless its file is on one of these lists. OS handoffs are
# whole files, one per crate, at exactly crates/<crate>/src/os_launch.rs; the
# list is permanent and is not shrink-checked. There is no allow list: an
# agent spawn outside er-agent is an error.
agent-spawn-os-launch = [
  "crates/er-engine/src/os_launch.rs",
  "crates/er-desktop/src/os_launch.rs",
  "crates/er-tui/src/os_launch.rs",
]

# `Command::new("git")` outside the crate that owns git: call the Git trait.
# There is no allow-list; every spawn outside the home crate is an error.
[workspace.metadata.lint-gate.spawn.git]
home = "crates/er-git"

# `Command::new("gh")` outside the crate that owns GitHub: call the GitHub trait.
[workspace.metadata.lint-gate.spawn.gh]
home = "crates/er-github"

[profile.release]
opt-level = 3
lto = true
strip = true
