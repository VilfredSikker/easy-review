name: Mutation Testing

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:00 UTC — mutation runs are too slow for PR CI.
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  mutants:
    name: Mutants (er-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      # Informational job: surviving mutants must not fail the workflow.
      continue-on-error: true
      - name: Run mutation testing
        run: |
          mkdir -p mutants.out
          cargo mutants -p er-engine 2>&1 | tee mutants.out/run.log
      - name: Show mutation score
        run: grep -iE "mutation score" mutants.out/run.log || tail -5 mutants.out/run.log
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants.out/
