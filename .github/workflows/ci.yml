name: CI

on:
  push:
    branches: [main, master, 'release/**', 'release-*']
  pull_request:
    branches: [main, master, 'release/**', 'release-*']

# Agent sessions push often; a run for a commit that has been superseded on the
# same PR is wasted. Each push gets its own group: a shared one would drop
# queued full runs on main when merges land close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A PR runs only the jobs whose inputs it touched. Pushes to main and release
  # branches run everything, so a wrong filter shows up there rather than going
  # unnoticed. No status check is required by the ruleset, so a skipped job
  # does not hold a merge.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    # paths-filter lists a PR's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'push' || steps.filter.outputs.rust == 'true' }}
      ui: ${{ github.event_name == 'push' || steps.filter.outputs.ui == 'true' }}
      herdr: ${{ github.event_name == 'push' || steps.filter.outputs.herdr == 'true' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            rust:
              - *ci
              - 'crates/**'
              - 'tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'clippy-warning-budget.json'
            ui:
              - *ci
              - 'desktop-ui/**'
            herdr:
              - *ci
              - 'tools/herdr-easy-review/**'

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tauri-linux-deps
        # A stalled mirror should fail fast; a re-run usually gets a good one.
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  desktop-ui-lint:
    name: Desktop UI lint
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The ratchet gate (ADR 0038), then its own tests.
      - run: bun run lint --no-cache
      - run: bun test scripts

  herdr-plugin:
    name: Herdr plugin
    needs: changes
    if: needs.changes.outputs.herdr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd tools/herdr-easy-review && npm test

  # Also the type check: the gate runs clippy with --workspace --all-targets,
  # which covers everything `cargo check --all-targets` did.
  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tauri-linux-deps
        timeout-minutes: 5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The ratchet gate (ADR 0038). The budget is counted on macOS, where
      # platform-gated code differs, so the stale check stays local.
      - run: cargo run -q -p er-lint-gate -- --no-stale

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  headless:
    name: Engine (headless)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      # No Tauri system deps on purpose: er-engine without UI features must
      # build in a bare container.
      - run: cargo build -p er-engine --no-default-features
      - run: cargo build -p er-engine --no-default-features --features highlight

  # Runs only on the release PR into main. The report is not a gate, and it
  # repeats the engine and TUI tests under instrumentation, so once per release
  # is enough.
  crap:
    name: CRAP tooling + report
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref == 'main'
      && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The CRAP tooling itself (formula, complexity analyzer, LCOV parser,
      # and the positive/negative gate fixtures) must stay green. See
      # docs/quality-checks.md.
      - name: CRAP tool tests (incl. negative gate fixtures)
        run: cargo test -p er-crap
      - name: Coverage (er-engine + er-tui)
        run: cargo llvm-cov -p er-engine -p er-tui --lcov --output-path lcov.info
      # Report-only on purpose: the coverage-based baseline is not yet
      # under the threshold, so --fail-above stays off until it is (see
      # docs/quality-checks.md). Paths are scoped to the crates llvm-cov
      # measured so untouched crates don't score pessimistic 0% coverage.
      - name: CRAP report (er-engine + er-tui)
        run: cargo run -p er-crap -- --lcov lcov.info --path crates/er-engine --path crates/er-tui --summary
