name: CI

on:
  push:
    branches: [main, master, 'release/**', 'release-*']
  pull_request:
    branches: [main, master, 'release/**', 'release-*']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  herdr-plugin:
    name: Herdr plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd tools/herdr-easy-review && npm test

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  headless:
    name: Engine (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # No Tauri system deps on purpose: er-engine without UI features must
      # build in a bare container.
      - run: cargo build -p er-engine --no-default-features
      - run: cargo build -p er-engine --no-default-features --features highlight

  crap:
    name: CRAP tooling + report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # The CRAP tooling itself (formula, complexity analyzer, LCOV parser,
      # and the positive/negative gate fixtures) must stay green. See
      # docs/quality-checks.md.
      - name: CRAP tool tests (incl. negative gate fixtures)
        run: cargo test -p er-crap
      - name: Coverage (er-engine + er-tui)
        run: cargo llvm-cov -p er-engine -p er-tui --lcov --output-path lcov.info
      # Report-only on purpose: the coverage-based baseline is not yet
      # under the threshold, so --fail-above stays off until it is (see
      # docs/quality-checks.md). Paths are scoped to the crates llvm-cov
      # measured so untouched crates don't score pessimistic 0% coverage.
      - name: CRAP report (er-engine + er-tui)
        run: cargo run -p er-crap -- --lcov lcov.info --path crates/er-engine --path crates/er-tui --summary
