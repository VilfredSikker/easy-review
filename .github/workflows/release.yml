name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # npm publish uses OIDC trusted publishing when configured; token fallback via secrets.
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build er (TUI)
        run: cargo build --release --target ${{ matrix.target }} -p er-tui

      - name: Build er-mcp
        run: cargo build --release --target ${{ matrix.target }} -p er-mcp

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../er-${{ matrix.target }}.tar.gz er
          tar -czf ../../../er-mcp-${{ matrix.target }}.tar.gz er-mcp
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: |
            er-${{ matrix.target }}.tar.gz
            er-mcp-${{ matrix.target }}.tar.gz

      - name: Upload er-mcp binary
        uses: actions/upload-artifact@v4
        with:
          name: ermcp-bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/er-mcp
          if-no-files-found: error

  build-desktop:
    name: Build signed desktop DMG (macOS arm64)
    runs-on: macos-latest
    # A real signing failure (expired certificate, notary outage) must not take
    # the release down — the release job tolerates a missing DMG.
    continue-on-error: true
    # Job-level so the step `if:` conditions can read them; a step's own `env`
    # is not visible to its own `if`.
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        # Gated with the rest: no certificate, no DMG, so don't spend minutes
        # building a CLI nothing will use.
        if: env.APPLE_CERTIFICATE != ''
        run: cargo install tauri-cli --locked --version "^2.0"

      - name: Import Developer ID certificate
        # `tauri-sign-release.sh` finds the identity with `security find-identity`,
        # and a fresh runner's keychain is empty — APPLE_SIGNING_IDENTITY names an
        # identity the runner does not hold, so codesign fails with
        # "no identity found". Import the .p12 into a throwaway keychain.
        #
        # APPLE_CERTIFICATE is the base64 of an exported Developer ID Application
        # .p12; APPLE_CERTIFICATE_PASSWORD is the password set during that export.
        if: env.APPLE_CERTIFICATE != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/er-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT_PATH"
          # Without a partition list codesign blocks on an interactive prompt
          # that no one is there to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Make it the search list so `find-identity` sees it. Replacing the
          # login keychain is safe here: nothing else on the runner signs, and
          # notarization authenticates with APPLE_PASSWORD, not the keychain.
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build signed + notarized DMG
        # Gated on the certificate rather than left to fail: without it the build
        # burns ten minutes only to die at codesign. No certificate, no DMG, and
        # the upload below tolerates the absence.
        if: env.APPLE_CERTIFICATE != ''
        run: ER_SKIP_DMG=0 ER_SKIP_INSTALL=1 ./scripts/tauri-sign-release.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: target/desktop/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

      - name: Remove signing keychain
        if: always()
        run: rm -f "$RUNNER_TEMP/er-signing.keychain-db" "$RUNNER_TEMP/certificate.p12"

  release:
    name: Create Release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download TUI/MCP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bins-*
          merge-multiple: true

      - name: Download desktop DMG
        # build-desktop is continue-on-error; the artifact may not exist if signing
        # failed or was skipped. Allow missing artifacts so the release still publishes
        # the TUI/MCP binaries.
        uses: actions/download-artifact@v4
        with:
          name: desktop-dmg
          path: desktop
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            er-*.tar.gz
            er-mcp-*.tar.gz
            desktop/*.dmg

  npm:
    name: Publish easy-review-mcp to npm
    needs: release
    runs-on: ubuntu-latest
    # Opt-in: set repo variable PUBLISH_NPM=true and configure NPM_TOKEN (or trusted publishing).
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ermcp-bin-*
          path: artifacts

      - name: Stage platform binaries
        run: |
          set -euo pipefail
          declare -A MAP=(
            [aarch64-apple-darwin]=darwin-arm64
            [x86_64-apple-darwin]=darwin-x64
            [x86_64-unknown-linux-gnu]=linux-x64
          )
          for tgt in "${!MAP[@]}"; do
            key="${MAP[$tgt]}"
            src="artifacts/ermcp-bin-$tgt/er-mcp"
            dst="npm/platforms/$key/er-mcp"
            cp "$src" "$dst"
            chmod +x "$dst"
            echo "staged $tgt -> $dst"
          done

      - name: Verify versions match tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          for dir in npm/er-mcp npm/skills npm/platforms/darwin-arm64 npm/platforms/darwin-x64 npm/platforms/linux-x64; do
            PKG=$(node -p "require('./$dir/package.json').version")
            if [ "$TAG" != "$PKG" ]; then
              echo "Version mismatch in $dir: $PKG != tag $TAG"
              exit 1
            fi
          done
          # The launcher's optionalDependencies pins must also match the tag, or
          # npm silently skips the (nonexistent) platform version and every user
          # falls back to the GitHub download this change exists to avoid.
          for pkg in easy-review-mcp-darwin-arm64 easy-review-mcp-darwin-x64 easy-review-mcp-linux-x64; do
            PIN=$(node -p "require('./npm/er-mcp/package.json').optionalDependencies['$pkg']")
            if [ "$TAG" != "$PIN" ]; then
              echo "optionalDependencies pin mismatch: $pkg=$PIN != tag $TAG"
              exit 1
            fi
          done

      - name: Publish platform packages
        run: |
          set -euo pipefail
          for key in darwin-arm64 darwin-x64 linux-x64; do
            ( cd "npm/platforms/$key" && npm publish --access public )
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish launcher
        run: cd npm/er-mcp && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish skills installer
        run: cd npm/skills && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
