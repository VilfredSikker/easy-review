[package]
name = "er-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal UI for easy-review"

[[bin]]
name = "er"
path = "src/main.rs"

[dependencies]
er-agent = { path = "../er-agent" }
# Default features off, so the TUI names the engine features it uses.
er-engine = { path = "../er-engine", default-features = false, features = ["watch", "highlight"] }
er-git = { path = "../er-git" }
er-service = { path = "../er-service" }
# The view file is saved through the store.
er-store = { path = "../er-store" }
# The builders' wire types.
er-protocol = { path = "../er-protocol" }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# CLI
clap = { version = "4", features = ["derive"] }

tui-textarea-2 = { version = "0.13", default-features = false, features = ["crossterm"] }

# Shared (needed for types crossing the boundary, e.g. serde derives, anyhow::Result)
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# `er update` and the status-bar release check (HTTP stays out of er-engine, ADR 0026)
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"

[dev-dependencies]
# Thread-scoped ER_STORAGE_ROOT override for tests that seed the projects record.
er-engine = { path = "../er-engine", default-features = false, features = ["watch", "highlight", "test-support"] }
# The scripted GitHub port, for the flag-on `--pr` start.
er-github = { path = "../er-github" }
# The gated fake agent and the planning worker, for the flag-on run tests.
er-service = { path = "../er-service", features = ["test-support"] }
# The manifest test reads every form of a dependency table.
toml.workspace = true

[lints]
workspace = true
