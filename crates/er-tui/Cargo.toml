[package]
name = "er-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Terminal UI for easy-review"

[[bin]]
name = "er"
path = "src/main.rs"

[dependencies]
er-agent = { path = "../er-agent" }
er-engine = { path = "../er-engine" }
er-git = { path = "../er-git" }
er-service = { path = "../er-service", optional = true }

# TUI
ratatui = "0.30"
crossterm = "0.29"

# CLI
clap = { version = "4", features = ["derive"] }

tui-textarea-2 = { version = "0.13", default-features = false, features = ["crossterm"] }

# Shared (needed for types crossing the boundary, e.g. serde derives, anyhow::Result)
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

# `er update` and the status-bar release check (HTTP stays out of er-engine, ADR 0026)
ureq = { version = "3", default-features = false, features = ["rustls"] }
tempfile = "3"

[features]
default = []
# Compiles the v1 service path beside the App path. Off by default.
v1-service = ["dep:er-service"]

[dev-dependencies]
# Thread-scoped ER_STORAGE_ROOT override for tests that seed the projects record.
er-engine = { path = "../er-engine", features = ["test-support"] }

[lints]
workspace = true
