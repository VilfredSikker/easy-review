[package]
name = "er-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Workspace actor and use cases for easy-review"

[dependencies]
er-engine = { path = "../er-engine", default-features = false }
er-store = { path = "../er-store" }
er-git = { path = "../er-git" }
er-github = { path = "../er-github" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The thread-scoped storage root is behind this feature on the engine.
er-engine = { path = "../er-engine", default-features = false, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
