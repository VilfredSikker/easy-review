[package]
name = "er-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Workspace actor and use cases for easy-review"

[features]
# Compiles `Command::Stall` and `Command::Hold`; a dependent's test holds an
# actor with them to show that a read never waits on it. Also the gated fake
# agent the task tests run, and the agent runtime's refusal of real provider
# CLIs.
test-support = ["er-agent/test-support"]

[dependencies]
# P40's actor reads these types; declared here so P40 is manifest-free.
er-agent = { path = "../er-agent" }
er-core = { path = "../er-core" }
er-engine = { path = "../er-engine", default-features = false }
er-store = { path = "../er-store" }
er-git = { path = "../er-git" }
er-github = { path = "../er-github" }
# The wire types the resource builders answer in (ADR 0067).
er-protocol = { path = "../er-protocol" }
anyhow.workspace = true
log = "0.4"
# The app records' persisted files derive their schema for the store.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The slot test reads the process-wide pool under its serial guard.
er-agent = { path = "../er-agent", features = ["test-support"] }
# The thread-scoped storage root is behind this feature on the engine.
er-engine = { path = "../er-engine", default-features = false, features = ["test-support"] }
tempfile = "3"

[lints]
workspace = true
