[package]
name = "er-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "er-desktop"

[[bin]]
name = "er-desktop"
path = "src/main.rs"

[dependencies]
# No `ui`: the desktop names nothing of the App (ADR 0072). `watch` is the
# file watcher.
er-engine = { path = "../er-engine", default-features = false, features = ["watch"] }
er-store = { path = "../er-store" }
er-service = { path = "../er-service" }
# The wire to desktop-ui.
er-protocol = { path = "../er-protocol" }
tauri = { version = "2", features = ["devtools", "unstable", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
log = "0.4"
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["full"] }
rfd = "0.17"
dirs.workspace = true
portable-pty = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSBundle", "NSError"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
] }
block2 = "0.6"

[dev-dependencies]
er-engine = { path = "../er-engine", default-features = false, features = ["test-support"] }
er-git = { path = "../er-git" }
# `Command::Hold`, which the held-actor tests send to a workspace actor.
er-service = { path = "../er-service", features = ["test-support"] }
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
