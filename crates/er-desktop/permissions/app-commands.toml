# All application IPC commands (main window). Required once explicit capabilities
# are enabled in tauri.conf.json — plugin-only permissions are not enough.

[[permission]]
identifier = "allow-app-commands"
description = "All Easy Review application commands"
commands.allow = [
  "er_send",
  "er_fetch",
  "er_versions",
  "start_window_drag",
  "fetch_github_image",
  "open_in_editor",
  "open_in_vscode",
  "open_source",
  "open_url_in_browser",
  "reveal_er_folder",
  "reveal_path",
  "line_commits",
  "export_review",
  "export_review_to_file",
  "export_to_agent",
  "terminal_spawn",
  "terminal_write",
  "terminal_resize",
  "terminal_close",
  "detect_dev_url",
  "browser_ensure",
  "browser_hide",
  "browser_suspend_for_overlay",
  "browser_set_bounds",
  "browser_navigate",
  "browser_host_message",
  "browser_send_to_page",
  "browser_set_annotate_mode",
  "browser_reload",
  "dev_log_filter",
]
